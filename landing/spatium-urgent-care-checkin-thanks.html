<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Thank you — you're checked in at Spatium Urgent Care.">
  <title>You're checked in — Spatium Urgent Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #387648;
      --green-dark: #2d5f3a;
      --red: #b22d30;
      --red-dark: #8f2427;
      --bg: #f7faf7;
      --paper: #ffffff;
      --ink: #1a2420;
      --muted: #5c6b60;
      --line: #dce8de;
      --radius: 16px;
      --shadow: 0 20px 48px rgba(45, 56, 48, 0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Source Sans 3', system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.55;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      padding: 32px 22px 0;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(56, 118, 72, 0.12), transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(178, 45, 48, 0.08), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .card {
      flex: 1;
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 40px 28px 44px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .brand-lockup {
      margin-bottom: 24px;
      line-height: 1.1;
    }
    .brand-spatium {
      display: block;
      font-family: 'Montserrat', system-ui, sans-serif;
      font-size: clamp(1.65rem, 5vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--green);
    }
    .brand-sub {
      display: block;
      margin-top: 4px;
      font-family: 'Montserrat', system-ui, sans-serif;
      font-size: clamp(0.95rem, 3.5vw, 1.1rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--red);
    }
    .check-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(56, 118, 72, 0.12);
      color: var(--green);
      font-size: 1.75rem;
      line-height: 56px;
      font-weight: 700;
    }
    h1 {
      font-family: 'Montserrat', system-ui, sans-serif;
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--green-dark);
    }
    .lead {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 8px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    .site-link {
      margin-top: 28px;
      font-size: 0.95rem;
    }
    .site-link a {
      color: var(--red);
      text-decoration: none;
      font-weight: 600;
    }
    .site-link a:hover { text-decoration: underline; }
    .brand-bar {
      margin-top: auto;
      height: 8px;
      background: var(--red);
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="page">
    <div class="card">
      <div class="brand-lockup">
        <span class="brand-spatium">SPATIUM</span>
        <span class="brand-sub">URGENT CARE</span>
      </div>
      <div class="check-icon" aria-hidden="true">✓</div>
      <h1>You&apos;re all set!</h1>
      <p class="lead">Thank you for checking in. Please have a seat and we&apos;ll be with you shortly.</p>
      <p class="site-link"><a href="https://www.spatiumurgentcare.com/" target="_blank" rel="noopener noreferrer">spatiumurgentcare.com</a></p>
    </div>
    <div class="brand-bar" aria-hidden="true"></div>
  </div>

</body>
</html>
