<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tell Bay Area Heart how we can improve your experience.">
  <title>Your feedback — Bay Area Heart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f4f4;
      --paper: #fffcfc;
      --ink: #1a1416;
      --muted: #5c5256;
      --accent: #a61c2e;
      --accent-dark: #7a1220;
      --gold: #ffd700;
      --gold-light: #fff4a8;
      --gold-mid: #ffd700;
      --gold-dark: #b8860b;
      --line: #e8dede;
      --radius: 16px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Source Sans 3', system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.55;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      padding: 32px 22px 48px;
    }
    .card {
      max-width: 640px;
      margin: 0 auto;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 32px 28px 36px;
      box-shadow: 0 20px 48px rgba(26, 20, 22, 0.07);
    }
    h1 {
      font-family: 'Montserrat', system-ui, sans-serif;
      font-size: 1.75rem;
      margin-bottom: 8px;
      text-align: center;
    }
    .stars-display {
      text-align: center;
      font-size: clamp(2.5rem, 10vw, 4rem);
      letter-spacing: 0.15em;
      margin: 16px 0 20px;
      line-height: 1;
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-mid) 40%, #e6b800 75%, var(--gold-dark) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 6px rgba(184, 134, 11, 0.45));
    }
    .meta {
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }
    .meta-tight { margin-bottom: 16px; }
    .field-label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    .field-label-hint {
      font-weight: 500;
      color: var(--muted);
    }
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
      gap: 10px;
      margin-bottom: 8px;
      border: none;
      padding: 0;
      min-width: 0;
    }
    .tile {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      padding: 12px 14px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.25;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .tile input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }
    .tile:has(input:checked) {
      border-color: var(--accent);
      background: rgba(166, 28, 46, 0.08);
      box-shadow: 0 0 0 1px rgba(166, 28, 46, 0.2);
    }
    .tile:has(input:focus-visible) {
      outline: 3px solid rgba(166, 28, 46, 0.35);
      outline-offset: 2px;
    }
    .form-error {
      display: none;
      color: var(--accent-dark);
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .form-error.visible { display: block; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    textarea {
      width: 100%;
      min-height: 120px;
      padding: 14px 16px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      font-family: inherit;
      font-size: 1rem;
      resize: vertical;
      margin-bottom: 20px;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(166, 28, 46, 0.15);
    }
    .comments-block { margin-top: 20px; }
    .comments-block.hidden { display: none; }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 999px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff;
      transition: filter 0.15s ease;
    }
    .btn:hover { filter: brightness(1.05); }
    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .back a { color: var(--accent-dark); font-weight: 600; }
    .thank { display: none; text-align: center; padding: 20px 0; }
    .thank h2 { font-family: 'Montserrat', system-ui, sans-serif; margin-bottom: 8px; }

    @media (max-width: 520px) {
      body {
        padding: 20px 14px 32px;
        font-size: 16px;
      }
      .card {
        padding: 20px 16px 26px;
        border-radius: 14px;
      }
      h1 {
        font-size: 1.4rem;
        margin-bottom: 6px;
      }
      .stars-display {
        font-size: 2.15rem;
        letter-spacing: 0.08em;
        margin: 10px 0 12px;
      }
      .meta {
        font-size: 0.88rem;
        margin-bottom: 14px;
      }
      .meta-tight { margin-bottom: 12px; }
      .field-label {
        font-size: 0.85rem;
        margin-bottom: 8px;
        line-height: 1.35;
      }
      .field-label-hint {
        display: block;
        font-size: 0.8rem;
        margin-top: 2px;
      }
      .category-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
      }
      .tile {
        min-height: 44px;
        padding: 9px 7px;
        font-size: 0.78rem;
        line-height: 1.2;
        border-radius: 10px;
      }
      .comments-block { margin-top: 14px; }
      textarea {
        min-height: 100px;
        padding: 12px 14px;
        font-size: 16px;
        margin-bottom: 16px;
      }
      .btn { padding: 14px; font-size: 0.95rem; }
      .back { margin-top: 16px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="card" id="form-panel">
    <h1>We’re sorry we missed the mark</h1>
    <div class="stars-display" id="stars-display" aria-hidden="true"></div>
    <p class="meta" id="rating-line"></p>
    <p class="meta meta-tight">Your notes go directly to our team so we can improve your care.</p>

    <form id="feedback-form">
      <p class="field-label" id="category-label">What can we improve? <span class="field-label-hint">(select all that apply)</span></p>
      <fieldset class="category-grid" id="category-section" aria-labelledby="category-label">
        <legend class="sr-only">Areas we can improve</legend>
        <label class="tile"><input type="checkbox" name="category" value="Front Desk Experience"> Front Desk Experience</label>
        <label class="tile"><input type="checkbox" name="category" value="Wait Time"> Wait Time</label>
        <label class="tile"><input type="checkbox" name="category" value="Staff Communication"> Staff Communication</label>
        <label class="tile"><input type="checkbox" name="category" value="Appointment Scheduling"> Appointment Scheduling</label>
        <label class="tile"><input type="checkbox" name="category" value="Provider Experience"> Provider Experience</label>
        <label class="tile"><input type="checkbox" name="category" value="Quality of Care"> Quality of Care</label>
        <label class="tile"><input type="checkbox" name="category" value="Billing & Payments"> Billing &amp; Payments</label>
        <label class="tile"><input type="checkbox" name="category" value="Overall Experience"> Overall Experience</label>
        <label class="tile"><input type="checkbox" name="category" value="Other" id="category-other"> Other</label>
      </fieldset>
      <p class="form-error" id="form-error" role="alert"></p>

      <div class="comments-block" id="comments-block">
        <label for="message" id="message-label">Anything else you’d like us to know?</label>
        <textarea id="message" name="message" placeholder="Share as much detail as you’re comfortable with…"></textarea>
      </div>
      <button type="submit" class="btn">Send feedback</button>
    </form>
    <p class="back"><a href="/bay-area-heart-review">← Back to rating</a></p>
  </div>

  <div class="card thank" id="thank-panel">
    <h2>Thank you</h2>
    <p class="meta" style="margin-bottom:0">We read every message and take your experience seriously.</p>
    <p class="back"><a href="/bay-area-heart-review">← Back</a></p>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var stars = parseInt(params.get('stars'), 10);
      if (Number.isNaN(stars) || stars < 1 || stars > 4) stars = 1;
      var structured = stars <= 3;

      document.getElementById('stars-display').textContent = '★'.repeat(stars) + '☆'.repeat(5 - stars);
      document.getElementById('rating-line').textContent = 'You chose ' + stars + ' out of 5 stars.';

      var categorySection = document.getElementById('category-section');
      var categoryLabel = document.getElementById('category-label');
      var messageEl = document.getElementById('message');
      var messageLabel = document.getElementById('message-label');
      var formError = document.getElementById('form-error');
      if (structured) {
        categoryLabel.style.display = 'block';
        categorySection.style.display = 'grid';
        messageLabel.textContent = 'Anything else you’d like us to know?';
        messageEl.removeAttribute('required');
      } else {
        categoryLabel.style.display = 'none';
        categorySection.style.display = 'none';
        messageLabel.textContent = 'What could we do better?';
        messageEl.setAttribute('required', 'required');
      }

      function selectedCategories() {
        var boxes = categorySection.querySelectorAll('input[name="category"]:checked');
        var list = [];
        for (var i = 0; i < boxes.length; i++) list.push(boxes[i].value);
        return list;
      }

      function showError(text) {
        formError.textContent = text;
        formError.classList.add('visible');
      }

      function clearError() {
        formError.textContent = '';
        formError.classList.remove('visible');
      }

      categorySection.addEventListener('change', clearError);

      var FEEDBACK_EMAIL = 'infobah@qoroshealth.com';

      document.getElementById('feedback-form').addEventListener('submit', function (e) {
        e.preventDefault();
        clearError();
        var msg = messageEl.value.trim();
        var categories = selectedCategories();

        if (structured) {
          if (categories.length === 0) {
            showError('Please select at least one area we can improve.');
            return;
          }
          if (categories.indexOf('Other') !== -1 && !msg) {
            showError('Please tell us more when you select Other.');
            messageEl.focus();
            return;
          }
        } else if (!msg) {
          return;
        }

        var bodyParts = ['Rating: ' + stars + ' / 5 stars', ''];
        if (structured && categories.length) {
          bodyParts.push('Areas to improve:');
          for (var c = 0; c < categories.length; c++) {
            bodyParts.push('- ' + categories[c]);
          }
          bodyParts.push('');
        }
        if (msg) {
          bodyParts.push('Additional comments:');
          bodyParts.push(msg);
        }

        var subject = encodeURIComponent('Bay Area Heart feedback (' + stars + ' stars)');
        var body = encodeURIComponent(bodyParts.join('\n'));
        window.location.href = 'mailto:' + FEEDBACK_EMAIL + '?subject=' + subject + '&body=' + body;
        document.getElementById('form-panel').style.display = 'none';
        document.getElementById('thank-panel').style.display = 'block';
      });
    })();
  </script>

</body>
</html>
