<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Thank you — leave Bay Area Heart a review on Google.">
  <title>Thank you! — Bay Area Heart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f4f4;
      --paper: #fffcfc;
      --ink: #1a1416;
      --muted: #5c5256;
      --accent-dark: #7a1220;
      --gold: #ffd700;
      --gold-light: #fff4a8;
      --gold-mid: #ffd700;
      --gold-dark: #b8860b;
      --line: #e8dede;
      --radius: 16px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Source Sans 3', system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.55;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      padding: 32px 22px 48px;
    }
    .card {
      max-width: 520px;
      margin: 0 auto;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 36px 28px 40px;
      box-shadow: 0 20px 48px rgba(26, 20, 22, 0.07);
      text-align: center;
    }
    h1 {
      font-family: 'Montserrat', system-ui, sans-serif;
      font-size: 1.85rem;
      margin-bottom: 12px;
    }
    .stars-display {
      font-size: clamp(2.5rem, 10vw, 4rem);
      letter-spacing: 0.15em;
      margin: 16px 0 20px;
      line-height: 1;
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-mid) 40%, #e6b800 75%, var(--gold-dark) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 6px rgba(184, 134, 11, 0.45));
    }
    .lead {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 28px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 32px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      background: #4285f4;
      color: #fff;
      transition: filter 0.15s ease, transform 0.15s ease;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .btn-secondary {
      display: block;
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .btn-secondary a { color: var(--accent-dark); font-weight: 600; }
    .site-link {
      display: block;
      margin-top: 10px;
      font-size: 0.95rem;
    }
    .site-link a { color: var(--accent-dark); font-weight: 600; }
  </style>
</head>
<body>

  <div class="card">
    <h1>We’re so glad you had a great experience!</h1>
    <div class="stars-display" id="stars-display" aria-hidden="true"></div>
    <p class="lead" id="rating-line"></p>
    <p class="lead" style="margin-bottom:20px">Would you share your experience on <strong>Google</strong>? It helps others find trusted cardiac care.</p>

    <a class="btn" id="google-btn" href="#" role="button">Leave a Google review</a>
    <p class="btn-secondary"><a href="/bay-area-heart-review">← Back to rating</a></p>
    <p class="site-link"><a href="https://bayareaheart.com/" target="_blank" rel="noopener noreferrer">bayareaheart.com</a></p>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var stars = parseInt(params.get('stars'), 10);

      if (Number.isNaN(stars) || stars < 5) {
        var redirectStars = Number.isNaN(stars) || stars < 1 ? 1 : Math.min(stars, 4);
        window.location.replace('/bay-area-heart-review/feedback?stars=' + redirectStars);
        return;
      }

      document.getElementById('stars-display').textContent = '★★★★★';
      document.getElementById('rating-line').textContent = 'You chose 5 out of 5 stars.';

      /** Paste Google Business Profile “Write a review” URL when available. */
      var GOOGLE_REVIEW_URL = '';

      var btn = document.getElementById('google-btn');

      function googleReviewConfigured(url) {
        return typeof url === 'string' && /^https?:\/\//i.test(url.trim());
      }

      if (googleReviewConfigured(GOOGLE_REVIEW_URL)) {
        btn.href = GOOGLE_REVIEW_URL.trim();
        btn.setAttribute('target', '_blank');
        btn.setAttribute('rel', 'noopener noreferrer');
        btn.removeAttribute('role');
      } else {
        btn.href = 'https://www.google.com/maps/search/?api=1&query=Bay+Area+Heart+450+Blossom+St+Webster+TX+77598';
        btn.setAttribute('target', '_blank');
        btn.setAttribute('rel', 'noopener noreferrer');
        btn.removeAttribute('role');
      }
    })();
  </script>

</body>
</html>
